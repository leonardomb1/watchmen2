services:
  database:
    image: postgres:latest
    container_name: greencrest-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: greencrest
      POSTGRES_USER: greencrest_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencrest_user -d greencrest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greencrest-network

  nginx:
    image: nginx:alpine
    container_name: wms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - greencrest-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greencrest-migrate
    env_file:
      - .env
    environment:
      ConnectionStrings__PostgreSql: "Host=${DB_HOST};Port=${DB_PORT};Database=greencrest;Username=greencrest_user;Password=${DB_PASSWORD:-changeme};Pooling=true;MinPoolSize=5;MaxPoolSize=100;ConnectionIdleLifetime=300;CommandTimeout=30"
    command: ["migrate"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - greencrest-network   

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greencrest-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./apikeys.json:/app/apikeys.json:rw
      - encrypt_data:/app/.aspnet/DataProtection-Keys:rw
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["serve"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
    environment:
      # This enables communication between DOTNET and Tempo
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"

      # Performance Configs
      DOTNET_gcServer: "1"
      DOTNET_gcConcurrent: "1"
      DOTNET_GCHeapCount: "2"
      DOTNET_GCNoAffinitize: "1"

      ConnectionStrings__PostgreSql: "Host=${DB_HOST};Port=${DB_PORT};Database=greencrest;Username=greencrest_user;Password=${DB_PASSWORD:-changeme};Pooling=true;MinPoolSize=5;MaxPoolSize=100;ConnectionIdleLifetime=300;CommandTimeout=30"

      # JWT Configs
      Jwt__Secret: ${JWT_SECRET:-change-this-secret-minimum-32-characters-long-for-production}
      Jwt__Issuer: ${JWT_ISSUER:-Watchmen.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Watchmen.Client}

      # Super Admin
      SuperAdmin__Email: ${SUPERADMIN_EMAIL:-admin@greencrest.local}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD:-admin123}

      # Security
      HashingKey: ${HASHING_KEY:-change-this-hashing-key-for-production}

      # Rate Limiting
      RateLimiting__PermitLimit: ${RATE_LIMIT_PERMITS:-100}
      RateLimiting__WindowInMinutes: ${RATE_LIMIT_WINDOW:-1}
      RateLimiting__QueueLimit: ${RATE_LIMIT_QUEUE:-0}

      # Caching
      CacheSettings__ExpirationInMinutes: ${CACHE_EXPIRATION:-60}

      # OpenTelemetry
      OpenTelemetry__OtlpEndpoint: ${OTEL_ENDPOINT:-http://jaeger:4317}

      # Pagination
      PaginationSize: ${PAGINATION_SIZE:-100}

      # Environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - greencrest-network

  tempo:
    image: grafana/tempo:latest
    container_name: greencrest-tempo
    restart: unless-stopped
    user: root
    volumes:
      - ./tempo-local.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "4317:4317"
      - "3200:3200"
    command: 
      - "-config.file=/etc/tempo/tempo.yml"
    networks:
      - greencrest-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: greencrest-prometheus
    restart: unless-stopped
    user: "65534"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - api
    networks:
      - greencrest-network

  # Grafana - Dashboards & Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: greencrest-grafana
    restart: unless-stopped
    user: "472"
    # Port removed - access only through nginx proxy at metrics.greencrest.com.br
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - tempo
    networks:
      - greencrest-network

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local
  encrypt_data:
    driver: local

networks:
  greencrest-network:
    driver: bridge

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # SECURITY: Hide Nginx version
    server_tokens off;

    upstream api_backend {
        server api:8080;
        keepalive 64;
    }

    upstream grafana_backend {
        server grafana:3000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Redirect HTTP to HTTPS for API
    server {
        listen 80;
        server_name api.greencrest.com.br;
        return 301 https://$host$request_uri;
    }

    # Redirect HTTP to HTTPS for Grafana
    server {
        listen 80;
        server_name metrics.greencrest.com.br;
        return 301 https://$host$request_uri;
    }

    # API Server - Public Access with SSL
    server {
        listen 443 ssl;
        server_name api.greencrest.com.br;

        ssl_certificate /etc/nginx/ssl/certificate.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # --- SECURITY FIREWALL ---
        # 1. Block "Rondo" and other PHP/CGI exploits
        location ~ \.(php|aspx|asp|cgi|pl|env|git|svn|sh)$ {
            access_log off; 
            log_not_found off;
            return 444;
        }

        # 2. Block Hidden Files (except .well-known for Certbot)
        location ~ /\.(?!well-known).* {
            return 444;
        }
        # -------------------------

        # Proxy settings
        location / {
            proxy_pass http://api_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache Bypass
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Grafana Server - IP Restricted Access with SSL
    server {
        listen 443 ssl;
        server_name metrics.greencrest.com.br;

        ssl_certificate /etc/nginx/ssl/certificate.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Use real IP from Cloudflare
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        real_ip_header CF-Connecting-IP;

        # IP Address Restrictions (using real client IP from Cloudflare)
        # Replace with your actual IP address(es)
        allow 187.23.167.172/32;  # Your current IP
        # allow ADDITIONAL.IP.HERE/32;  # Add more IPs as needed
        deny all;

        location / {
            proxy_pass http://grafana_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache Bypass
            proxy_cache_bypass $http_upgrade;
        }
    }
}
